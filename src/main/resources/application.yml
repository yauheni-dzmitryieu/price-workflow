spring:
  profiles:
    active: dev
  redis:
    redisson:
      file: classpath:redisson.yml


  datasource:
    url: jdbc:postgresql://localhost:5432/pricingdb
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: classpath:error-messages.yml


springdoc:
  swagger-ui:
    use-root-path: true

logging:
  level:
    root: INFO
    com.yd.price.workflow: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: false
    db:
      enabled: true
  endpoint:
    health:
      show-details: always


mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.yd.price.workflow.persistence.entity


server:
  port: 8087


app:
  cache:
    l1:
      enabled: true
      caches:
        product-cache:
          expire-after-write: 10m
          maximum-size: 10_000
        price-adjustment-cache:
          expire-after-write: 10m
          maximum-size: 10_000
    l2:
      enabled: true
      caches:
        product-cache:
          expire: 1d
        price-adjustment-cache:
          expire: 1d
