spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pricingdb
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration


springdoc:
  swagger-ui:
    use-root-path: true


management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: true
    db:
      enabled: true
  endpoint:
    health:
      show-details: always


mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.yd.price.workflow.persistence.entity


server:
  port: 8087

