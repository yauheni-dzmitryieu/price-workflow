spring:
  profiles:
    active: dev
  redis:
    redisson:
      config: |
        sentinelServersConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 100
          masterName: "mymaster"
          database: 0
          failedSlaveNodeDetector: !<org.redisson.client.FailedCommandsTimeoutDetector> {checkInterval: 1000, failedCommandsLimit: 1}
          sentinelAddresses: ${SPRING_REDIS_REDISON_SENTINEL_ADDRESSES: ["redis://127.0.0.1:26379", "redis://127.0.0.1:26379", "redis://127.0.0.1:26379"]}
          retryAttempts: 3
          retryInterval: 10000
          checkSentinelsList: false
          sentinelsDiscovery: true



  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: classpath:error-messages.yml


springdoc:
  swagger-ui:
    use-root-path: true

logging:
  level:
    root: INFO
    com.yd.price.workflow: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: false
    db:
      enabled: true
  endpoint:
    health:
      show-details: always


mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.yd.price.workflow.persistence.entity


server:
  port: 8087


app:
  cache:
    l1:
      enabled: true
      caches:
        product-cache:
          expire-after-write: 10m
          maximum-size: 10_000
        price-adjustment-cache:
          expire-after-write: 10m
          maximum-size: 10_000
    l2:
      enabled: true
      scheduler-health-check-fixed-rate: 1
      caches:
        product-cache:
          expire: 1d
        price-adjustment-cache:
          expire: 1d
